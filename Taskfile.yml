version: '3'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  SERVER_BINARY: "server{{.EXE}}"
  SERVER_PATH: "./cmd/server"
  CLIENT_BINARY: "client{{.EXE}}"
  CLIENT_PATH: "./cmd/client"
  VERSION:
    sh: git describe --tags --always --dirty 2>nul || echo dev
  BUILD_DATE:
    sh: powershell -NoProfile -Command "Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ'"
  LDFLAGS: "-X main.Version={{.VERSION}} -X main.BuildDate={{.BUILD_DATE}}"

tasks:
  default:
    desc: "Показать список доступных задач"
    cmds:
      - task --list

  # ==================== Сборка ====================

  build:
    desc: "Собрать сервер и клиент"
    deps:
      - build-server
      - build-client

  build-server:
    desc: "Собрать сервер"
    deps:
      - proto-gen
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.SERVER_PATH}}/{{.SERVER_BINARY}} {{.SERVER_PATH}}

  build-client:
    desc: "Собрать клиент"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.CLIENT_PATH}}/{{.CLIENT_BINARY}} {{.CLIENT_PATH}}

  # ==================== Кросс-компиляция ====================

  build-all:
    desc: "Собрать для всех платформ"
    deps:
      - proto-gen
    cmds:
      - task: build-client-linux-amd64
      - task: build-client-linux-arm64
      - task: build-client-darwin-amd64
      - task: build-client-darwin-arm64
      - task: build-client-windows-amd64

  build-client-linux-amd64:
    desc: "Собрать клиент для Linux AMD64"
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/gophkeeper-linux-amd64 {{.CLIENT_PATH}}

  build-client-linux-arm64:
    desc: "Собрать клиент для Linux ARM64"
    env:
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/gophkeeper-linux-arm64 {{.CLIENT_PATH}}

  build-client-darwin-amd64:
    desc: "Собрать клиент для macOS AMD64"
    env:
      GOOS: darwin
      GOARCH: amd64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/gophkeeper-darwin-amd64 {{.CLIENT_PATH}}

  build-client-darwin-arm64:
    desc: "Собрать клиент для macOS ARM64"
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/gophkeeper-darwin-arm64 {{.CLIENT_PATH}}

  build-client-windows-amd64:
    desc: "Собрать клиент для Windows AMD64"
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o ./bin/gophkeeper-windows-amd64.exe {{.CLIENT_PATH}}

  # ==================== Запуск ====================

  run-server:
    desc: "Запустить сервер"
    deps:
      - build-server
    cmds:
      - '{{.SERVER_PATH}}/{{.SERVER_BINARY}}'

  run-client:
    desc: "Запустить клиент"
    deps:
      - build-client
    cmds:
      - '{{.CLIENT_PATH}}/{{.CLIENT_BINARY}}'

  # ==================== Protobuf ====================

  proto-gen:
    desc: "Сгенерировать Go код из proto файлов"
    cmds:
      - >-
        protoc
        --proto_path=api/proto
        --go_out=internal/server/grpc/pb
        --go_opt=paths=source_relative
        --go-grpc_out=internal/server/grpc/pb
        --go-grpc_opt=paths=source_relative
        auth.proto
        secrets.proto
        sync.proto

  # ==================== Тестирование ====================

  test:
    desc: "Запустить unit-тесты (быстро)"
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: "Запустить unit-тесты с race detector"
    cmds:
      - go test -race -count=1 ./...

  test-v:
    desc: "Запустить unit-тесты (verbose)"
    cmds:
      - go test -count=1 -v ./...

  test-cover:
    desc: "Запустить тесты с отчётом о покрытии"
    cmds:
      - go test -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated"

  # ==================== Линтинг и форматирование ====================

  lint:
    desc: "Запустить golangci-lint"
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: "Отформатировать код"
    cmds:
      - gofmt -w .
      - goimports -w .

  # ==================== Миграции ====================

  migrate-up:
    desc: "Применить миграции"
    cmds:
      - migrate -path ./migrations -database "${GOPHKEEPER_DATABASE_DSN}" up

  migrate-down:
    desc: "Откатить миграции"
    cmds:
      - migrate -path ./migrations -database "${GOPHKEEPER_DATABASE_DSN}" down 1

  migrate-create:
    desc: "Создать новую миграцию"
    cmds:
      - migrate create -ext sql -dir ./migrations -seq {{.CLI_ARGS}}

  # ==================== Документация ====================

  docs:
    desc: "Открыть документацию в браузере"
    cmds:
      - pkgsite -open

  # ==================== Утилиты ====================

  clean:
    desc: "Очистить артефакты сборки"
    cmds:
      - rm -rf ./bin
      - rm -f {{.SERVER_PATH}}/{{.SERVER_BINARY}}
      - rm -f {{.CLIENT_PATH}}/{{.CLIENT_BINARY}}
      - rm -f coverage.out coverage.html

  tidy:
    desc: "Обновить зависимости"
    cmds:
      - go mod tidy

  deps:
    desc: "Скачать зависимости"
    cmds:
      - go mod download
