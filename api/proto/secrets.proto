syntax = "proto3";

package gophkeeper.api.v1;

option go_package = "gophkeeper/internal/server/grpc/pb;pb";

import "google/protobuf/timestamp.proto";

// SecretService предоставляет методы для работы с секретами.
service SecretService {
  // Create создаёт новый секрет.
  rpc Create(CreateSecretRequest) returns (CreateSecretResponse);
  
  // Get возвращает секрет по ID.
  rpc Get(GetSecretRequest) returns (GetSecretResponse);
  
  // Update обновляет существующий секрет.
  rpc Update(UpdateSecretRequest) returns (UpdateSecretResponse);
  
  // Delete удаляет секрет (soft delete).
  rpc Delete(DeleteSecretRequest) returns (DeleteSecretResponse);
  
  // List возвращает список всех секретов пользователя.
  rpc List(ListSecretsRequest) returns (ListSecretsResponse);
}

// SecretType определяет тип секрета.
enum SecretType {
  // SECRET_TYPE_UNSPECIFIED - тип не указан.
  SECRET_TYPE_UNSPECIFIED = 0;
  
  // SECRET_TYPE_CREDENTIALS - пара логин/пароль.
  SECRET_TYPE_CREDENTIALS = 1;
  
  // SECRET_TYPE_TEXT - текстовые данные.
  SECRET_TYPE_TEXT = 2;
  
  // SECRET_TYPE_BINARY - бинарные данные.
  SECRET_TYPE_BINARY = 3;
  
  // SECRET_TYPE_CARD - данные банковской карты.
  SECRET_TYPE_CARD = 4;
}

// Secret представляет зашифрованный секрет.
message Secret {
  // Уникальный идентификатор секрета.
  string id = 1;
  
  // Название секрета (для отображения пользователю).
  string name = 2;
  
  // Тип секрета.
  SecretType type = 3;
  
  // Зашифрованные данные секрета.
  bytes encrypted_data = 4;
  
  // Метаданные в формате ключ-значение.
  map<string, string> metadata = 5;
  
  // Версия для разрешения конфликтов (оптимистичная блокировка).
  int64 version = 6;
  
  // Дата создания.
  google.protobuf.Timestamp created_at = 7;
  
  // Дата последнего обновления.
  google.protobuf.Timestamp updated_at = 8;
}

// CreateSecretRequest содержит данные для создания секрета.
message CreateSecretRequest {
  // Название секрета.
  string name = 1;
  
  // Тип секрета.
  SecretType type = 2;
  
  // Зашифрованные данные.
  bytes encrypted_data = 3;
  
  // Метаданные.
  map<string, string> metadata = 4;
}

// CreateSecretResponse содержит созданный секрет.
message CreateSecretResponse {
  // Созданный секрет.
  Secret secret = 1;
}

// GetSecretRequest содержит ID запрашиваемого секрета.
message GetSecretRequest {
  // ID секрета.
  string id = 1;
}

// GetSecretResponse содержит запрошенный секрет.
message GetSecretResponse {
  // Секрет.
  Secret secret = 1;
}

// UpdateSecretRequest содержит данные для обновления секрета.
message UpdateSecretRequest {
  // ID обновляемого секрета.
  string id = 1;
  
  // Новое название (опционально).
  optional string name = 2;
  
  // Новые зашифрованные данные (опционально).
  optional bytes encrypted_data = 3;
  
  // Новые метаданные (опционально, полностью заменяют старые).
  map<string, string> metadata = 4;
  
  // Ожидаемая версия для оптимистичной блокировки.
  int64 expected_version = 5;
}

// UpdateSecretResponse содержит обновлённый секрет.
message UpdateSecretResponse {
  // Обновлённый секрет.
  Secret secret = 1;
}

// DeleteSecretRequest содержит ID удаляемого секрета.
message DeleteSecretRequest {
  // ID секрета для удаления.
  string id = 1;
}

// DeleteSecretResponse - пустой ответ при успешном удалении.
message DeleteSecretResponse {}

// ListSecretsRequest - запрос списка секретов (без параметров).
message ListSecretsRequest {}

// ListSecretsResponse содержит список секретов пользователя.
message ListSecretsResponse {
  // Список секретов.
  repeated Secret secrets = 1;
}
